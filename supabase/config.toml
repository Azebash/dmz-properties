project_id = "dmz-properties"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://dmz-properties.vercel.app"
additional_redirect_urls = [
  "https://dmz-properties.vercel.app/admin",
  "http://localhost:3000/admin",
]
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"
