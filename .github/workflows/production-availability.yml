name: Production availability

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check production health and database readiness
        env:
          DMZ_MONITOR_URL: https://dmz-properties.vercel.app
        run: node scripts/check-production-availability.mjs
